server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;

    # Redirige la raíz al basePath de la app.
    location = / {
        return 302 /polla-amigos/;
    }

    # Sirve el export estático bajo /polla-amigos.
    # try_files resuelve URLs limpias del App Router (carpeta/index.html y .html).
    location /polla-amigos {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Cache larga para los assets versionados de Next.js.
    location /polla-amigos/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Página 404 propia del export, si existe.
    error_page 404 /polla-amigos/404.html;
}
